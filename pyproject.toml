[project]
name = "gtasks-mcp"
version = "0.1.0"
description = "Stateless, OAuth2-protected MCP server for CRUD on Google Tasks"
readme = "README.md"
authors = [
    { name = "Grant Gould", email = "ggould@alum.mit.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.199.0",
    "google-auth>=2.57.0",
    "httpx2>=2.12.0",
    "mcp[cli]>=2.1.1",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
gtasks-mcp = "gtasks_mcp:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
